<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Signup</h1>
        </header>
        <main>
        <div id="main">
            <form method='post'>

    <input type="text" required id="name" placeholder="Name" class="input">


	<input type="email" required id="email" placeholder="Email" class="input">

	<input type="password" id="password" required placeholder="Password" class="input">

	<input type="password" id="password" required placeholder="Confirm Password" class="input">

    
	<input type="date" required id="dob" class="input">


    <div id="checking">
	<input type="radio" id="gender_m" name="gender" required class="check">
    <label for="gender_m">Student</label>

	<input type="radio" id="gender_f" name="gender" required class="check">
    <label for="gender_f">Employee</label>
</div>

<div id="terms">
	<input type="checkbox" id="tos" required >
    <label for="tos">I agree to all the Terms and Conditions</label>


	<button type="submit" class="button">Signup
	</button>
    </div>
    </form>
        </div>
        </main>

        <footer>
            <a href="">Privacy Policy</a>
            <a href="">Contact us</a>
        </footer>
    </body>
</html>
